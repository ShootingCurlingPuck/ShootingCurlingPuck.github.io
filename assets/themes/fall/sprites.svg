<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600">
  <!--
  Autumn sprite sheet. Loaded once by src/themes/toolkit.js, which copies every element whose id starts
  with "leaf-" or "prop-" into the page. Edit freely in Inkscape/Figma, but keep the ids.
  Leaves (leaf-*): tip up, stem down, about 80 units long, centred on 0,0. Keep the three paths with
  class stem / body / veins, and leave fill and stroke UNSET on them: every leaf gets its own colour
  from the code (fill = leaf colour, stroke = a darker shade of it). The code also makes a few slightly
  irregular copies of each leaf, so they don't all look identical.
  Props (prop-*): fixed colours. Standing ones (stump, mushrooms, chanterelles, mycena, puffball) have
  0,0 where they touch the ground. Lying ones rotate around a point the code knows: acorn, nut and cap
  as before; twigs, branch, conker and husk are centred on 0,0.

  ledge-bracket: a bracket fungus growing out of a vertical edge at x = 0, pointing right
  (the code mirrors it for left edges). critter-spider: the thread attaches at 0,-16.
  The outer groups with transform="translate(...)" and the yellow preview colours are only there so the
  shapes sit side by side in an editor; the page ignores them.
-->
