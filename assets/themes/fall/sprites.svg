<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300">
  <!--
  Autumn sprite sheet. Loaded once by src/themes/toolkit.js, which copies every element whose id starts
  with "leaf-" or "prop-" into the page. Edit freely in Inkscape/Figma, but keep the ids.
  Leaves (leaf-*): tip up, stem down, about 80 units long, centred on 0,0. Keep the three paths with
  class stem / body / veins, and leave fill and stroke UNSET on them: every leaf gets its own colour
  from the code (fill = leaf colour, stroke = a darker shade of it). The code also makes a few slightly
  irregular copies of each leaf, so they don't all look identical.
  Props (prop-*): fixed colours. 0,0 is where they touch the ground (acorn, nut and cap rotate around
  their middle, which the code knows about).
  The outer groups with transform="translate(...)" and the yellow preview colours are only there so the
  shapes sit side by side in an editor; the page ignores them.
-->
  <g transform="translate(60 60)" fill="#CFA24F" stroke="#5E4207">
    <g id="leaf-maple">
      <path class="stem" d="M0,20L1,40" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path class="body" d="M0,-42L7,-27L15,-31L13,-17L29,-25L26,-12L40,-11L31,-1L36,8L18,6L14,16L5,11L2,21L-2,21L-5,11L-14,16L-18,6L-36,8L-31,-1L-40,-11L-26,-12L-29,-25L-13,-17L-15,-31L-7,-27Z" stroke-width="2" stroke-linejoin="round"/>
      <path class="veins" d="M0,19L0,-34M0,12L27,-17M0,12L-27,-17M0,16L24,5M0,16L-24,5" fill="none" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
