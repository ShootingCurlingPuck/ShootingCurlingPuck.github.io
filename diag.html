<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV diagnostic</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
        color: #000;
      }
      body {
        padding: 12px 16px;
        font: 20px/1.3 monospace;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .bad {
        color: #c00;
        font-weight: bold;
      }
      .hd {
        background: #000;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <pre id="o"></pre>
    <script>
      // ES5 only on purpose: this page must run on any engine.
      var o = document.getElementById("o");
      var MARK = "Written to run on old TV browsers";
      var stamp = new Date().getTime();

      function log(s, cls) {
        var n = document.createElement("span");
        if (cls) n.className = cls;
        n.appendChild(document.createTextNode(s + "\n"));
        o.appendChild(n);
      }
      function head(s) {
        log("== " + s + " ==", "hd");
      }
      window.onerror = function (m, src, line) {
        log("PAGE ERROR: " + m + " (line " + line + ")", "bad");
      };
      // fn returns true / false / text. Text starting with FAIL is shown in red.
      function check(name, fn, optional) {
        var r;
        try {
          r = fn();
        } catch (e) {
          r = "FAIL " + e.message;
        }
        var bad = r === false || r === undefined || (typeof r === "string" && r.indexOf("FAIL") === 0);
        var text = r === true ? "ok" : r === false || r === undefined ? "MISSING" : r;
        log(name + ": " + text + (bad && optional ? "  (not needed)" : ""), bad && !optional ? "bad" : "");
      }

      head("Browser");
      log("UA: " + navigator.userAgent);
      var cm = /Chrome\/(\d+)/.exec(navigator.userAgent);
      log("Chromium major: " + (cm ? cm[1] : "unknown"));
      log("URL: " + location.href);
      log("Window: " + window.innerWidth + "x" + window.innerHeight);

      head("Syntax floorplan.js needs");
      var syn = [
        ["const / let", "const a = 1; let b = 2;", false],
        ["arrow functions", "var f = (x) => x;", false],
        ["template strings", "var s = `a${1}`;", false],
        ["destructuring", "var f = ([a, b]) => a;", false],
        ["for...of", "for (var x of [1]) {}", false],
        ["trailing comma in call", "Math.max(1, 2,);", true],
        ["async / await", "async function f() { await 1; }", true]
      ];
      for (var i = 0; i < syn.length; i++) {
        (function (s) {
          check(
            s[0],
            function () {
              try {
                new Function(s[1]);
                return true;
              } catch (e) {
                return "FAIL " + e.message;
              }
            },
            s[2]
          );
        })(syn[i]);
      }

      head("APIs");
      check("fetch", function () { return typeof fetch === "function"; });
      check("Promise", function () { return typeof Promise === "function"; });
      check("Map", function () { return typeof Map === "function"; });
      check("URLSearchParams", function () { return typeof URLSearchParams === "function"; });
      check("Object.assign", function () { return typeof Object.assign === "function"; });
      check("CSS variables", function () { return !!(window.CSS && CSS.supports && CSS.supports("--a", "0")); });
      check("SVG classList", function () { return !!document.createElementNS("http://www.w3.org/2000/svg", "g").classList; });
      check("canvas 2d", function () { return !!document.createElement("canvas").getContext("2d"); });
      check("AbortController", function () { return typeof AbortController === "function"; }, true);
      check("document.fonts", function () { return !!document.fonts; }, true);
      check("ink metrics", function () {
        var c = document.createElement("canvas").getContext("2d");
        return typeof c.measureText("A").actualBoundingBoxAscent === "number";
      }, true);
      check("Promise.finally", function () { return typeof Promise.prototype["finally"] === "function"; }, true);
      check("Object.fromEntries", function () { return typeof Object.fromEntries === "function"; }, true);
      check("formatToParts", function () { return typeof Intl.DateTimeFormat.prototype.formatToParts === "function"; }, true);
      check("Brussels time", function () {
        return (
          new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/Brussels", hour: "2-digit", minute: "2-digit" }) +
          " / " + new Date().toLocaleDateString("en-GB", { timeZone: "Europe/Brussels", weekday: "short" }) +
          "  (device clock: " + new Date().toString().slice(0, 24) + ")"
        );
      });
      check("emoji font", function () {
        var c = document.createElement("canvas").getContext("2d");
        c.font = "700 40px sans-serif";
        var a = c.measureText("\uD83D\uDEBB").width;
        var b = c.measureText("\uFFFF").width;
        return a !== b ? "ok (" + a + " vs " + b + ")" : "FAIL none, text labels will be used (" + a + " vs " + b + ")";
      }, true);
      log("emoji sample: \uD83D\uDEBB \u2B06\uFE0F\u2B07\uFE0F \uD83D\uDD07");

      // ---- floorplan.js: is the TV getting the new file, and does it compile? ----
      function get(url, cb) {
        var x = new XMLHttpRequest();
        x.open("GET", url, true);
        x.timeout = 15000;
        x.onload = function () { cb(x); };
        x.onerror = function () { cb(null, "network error"); };
        x.ontimeout = function () { cb(null, "timeout"); };
        x.send();
      }
      function describe(name, x, err) {
        if (!x) return log(name + ": " + err, "bad");
        var t = x.responseText || "";
        var isNew = t.indexOf(MARK) >= 0;
        log(
          name + ": HTTP " + x.status + ", " + t.length + " chars, " + (isNew ? "NEW version" : "OLD or wrong content") +
            ", modified " + (x.getResponseHeader("last-modified") || "?"),
          x.status === 200 && isNew ? "" : "bad"
        );
      }
      // Compile top-level chunks one by one to find the first real syntax error.
      function firstSyntaxError(text) {
        var lines = text.replace(/\r/g, "").split("\n");
        var buf = [], start = 1, k, next;
        for (k = 0; k < lines.length; k++) {
          if (buf.length === 0) start = k + 1;
          buf.push(lines[k]);
          next = lines[k + 1];
          if (lines[k] === "" && (next === undefined || /^[^\s\}\)\]]/.test(next))) {
            try {
              new Function(buf.join("\n"));
              buf = [];
            } catch (e) {
              if (!/end of input|missing/i.test(e.message)) {
                return "from line " + start + ": " + e.message + "  >> " + lines[start - 1].slice(0, 70);
              }
            }
          }
        }
        try {
          new Function(buf.join("\n"));
          new Function(text);
        } catch (e2) {
          return "whole file: " + e2.message;
        }
        return null;
      }

      function frameTest() {
        head("Full page in a hidden frame (8 s)");
        var fr = document.createElement("iframe");
        fr.style.cssText = "position:absolute;left:-9999px;top:0;width:1100px;height:620px;border:0";
        fr.src = "room-status-floorplan.html?mode=live&debug=1&nocache=" + stamp;
        document.body.appendChild(fr);
        setTimeout(function () {
          try {
            var d = fr.contentDocument;
            var q = function (s) { return d.querySelectorAll(s).length; };
            var ck = d.querySelector(".clock");
            var divs = d.body.getElementsByTagName("div");
            log("shapes drawn: " + q("rect") + " (expect ~47), clock: " + (ck ? ck.textContent : "none"), q("rect") > 10 ? "" : "bad");
            log("rooms busy/soon/free/nodata: " + q(".room.busy") + "/" + q(".room.soon") + "/" + q(".room.free") + "/" + q(".room.nodata"));
            log("on-screen error log: " + (divs.length ? divs[0].textContent || "(empty)" : "(none)"));
          } catch (e) {
            log("frame check failed: " + e.message, "bad");
          }
          log("DONE. Send me every line above (a photo is fine).");
        }, 8000);
      }

      head("floorplan.js as served");
      get("floorplan.js", function (x1, e1) {
        describe("as the TV normally loads it", x1, e1);
        get("floorplan.js?nocache=" + stamp, function (x2, e2) {
          describe("forced fresh copy           ", x2, e2);
          if (x2 && x2.status === 200) {
            var err = firstSyntaxError(x2.responseText);
            log("syntax scan of fresh copy: " + (err || "no errors found"), err ? "bad" : "");
          }
          frameTest();
        });
      });
    </script>
  </body>
</html>
