# Builds src/ into dist/app.js and publishes the site to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# If a build fails, nothing is published and the TV keeps running the last good version.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Switch to "npm ci" once package-lock.json is committed
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Collect the files the site needs
        run: |
          mkdir _site
          cp -r floorplan.css assets fonts dist _site/
          # the HTML pages as made TV-safe by the build (scripts/build-html.cjs), not the originals
          cp dist/html/*.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
